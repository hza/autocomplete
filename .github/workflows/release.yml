# Push a tag v* → build darwin-arm64, darwin-x86_64, linux-x86_64, linux-arm64 tarballs,
# publish a GitHub Release (+ install.sh, SHA256SUMS).
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-15            # arm64 runner; x86_64 is cross-compiled with -arch
    strategy:
      matrix:
        arch: [arm64, x86_64]
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v4
      - run: make dist CFLAGS="-O2 -Wall -Wextra -arch ${{ matrix.arch }}" TARGET=darwin-${{ matrix.arch }}
      - run: file autocomplete
      - if: matrix.arch == 'arm64'
        run: tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP" && "$RUNNER_TEMP/bin/autocomplete" list | head
      - uses: actions/upload-artifact@v4
        with:
          name: darwin-${{ matrix.arch }}
          path: dist/*.tar.gz

  build-linux:
    strategy:
      matrix:
        include:                  # native runners, no emulation
          - { arch: x86_64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      # static musl binary: runs on any distro of that arch (glibc or musl)
      - run: |
          docker run --rm -v "$PWD:/src" -w /src alpine:3.20 sh -c '
            apk add --no-cache build-base &&
            make dist TARGET=linux-${{ matrix.arch }} \
              CFLAGS="-O2 -Wall -Wextra -Wno-format-truncation -static" &&
            chown -R '"$(id -u):$(id -g)"' .'
      - run: file autocomplete && ./autocomplete list | head
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*.tar.gz

  release:
    needs: [build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: |
          cp install.sh dist/
          cd dist && sha256sum *.tar.gz install.sh > SHA256SUMS && cat SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes

